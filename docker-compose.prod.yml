# Production stack. Deploy from the repo root on the server with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# No database/secrets here, unlike the-obsidian-table's stack: this site is
# a static/SSR Next.js app with no backend. It only needs the shared
# Traefik "web" network to become reachable.

name: portfolio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Canonical host — serves the app.
      - "traefik.http.routers.portfolio.rule=Host(`gmmoulin.com`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=le"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3000"
      # www → apex, permanent redirect (same convention as the-obsidian-table).
      - "traefik.http.routers.portfolio-www.rule=Host(`www.gmmoulin.com`)"
      - "traefik.http.routers.portfolio-www.entrypoints=websecure"
      - "traefik.http.routers.portfolio-www.tls.certresolver=le"
      - "traefik.http.routers.portfolio-www.middlewares=portfolio-www-redirect"
      - "traefik.http.middlewares.portfolio-www-redirect.redirectregex.regex=^https://www\\.gmmoulin\\.com/(.*)"
      - "traefik.http.middlewares.portfolio-www-redirect.redirectregex.replacement=https://gmmoulin.com/$${1}"
      - "traefik.http.middlewares.portfolio-www-redirect.redirectregex.permanent=true"

networks:
  web:
    external: true
